[project]
name = "webling-mcp"
version = "0.1.0"
description = "Read-only MCP-Server für Webling-Vereinsverwaltung mit Privacy-Layer (Pseudonymisierung + lokales Rendern)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "spacy>=3.7",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=0.60",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
webling-mcp = "webling_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
